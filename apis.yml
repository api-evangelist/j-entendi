name: Já Entendi
description: Já Entendi is a Brazilian corporate-education (EdTech) company based in Curitiba that
  converts traditional corporate training materials into short, video-based online courses designed
  for workforces with lower levels of formal education. Its learning platform combines andragogy,
  heutagogy, storytelling, neurolinguistics, instructional design, and mind mapping to deliver more
  effective learning, offering both custom-built training solutions for large employee bases with
  sensitive or confidential content and a catalog of ready-made courses, all with integrated video
  lessons, assessments, and exercises. The company reports 1.2M+ students, 100+ courses, and 1,600+
  videos delivered. Backed by 500 Global. No public developer portal, API, or SDK is published.
